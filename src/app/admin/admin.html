<main class="admin-login-page">
  <section class="admin-login-layout" aria-labelledby="admin-login-title">
    <div class="admin-intro">
      <span class="admin-mark" aria-hidden="true">M</span>
      <p class="admin-eyebrow">MDNIY Publications</p>
      <h1>Administration portal</h1>
      <p class="admin-intro-copy">Manage publications and keep the digital library up to date.</p>
    </div>

    <div class="admin-form-panel">
      <p class="form-eyebrow">Secure access</p>
      <h2 id="admin-login-title">Administrator sign in</h2>
      <p class="form-description">Enter your administrator credentials to continue.</p>

      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
        <label for="admin-username">Username</label>
        <input
          id="admin-username"
          type="text"
          formControlName="username"
          autocomplete="username"
          required
        />

        <label for="admin-password">Password</label>
        <input
          id="admin-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
        />

        @if (loginError(); as error) {
          <p class="login-error" role="alert">{{ error }}</p>
        }

        <button type="submit" class="admin-submit">Sign in to dashboard</button>
      </form>
    </div>
  </section>
</main>
