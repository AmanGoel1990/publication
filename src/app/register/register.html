<section class="auth-panel" aria-label="Register form">
  <div class="auth-card">
    <h2>Create account</h2>
    <p>Register to place orders and manage your cart.</p>

    <form class="auth-form" (ngSubmit)="submitRegister()">
      <label>
        <span>Full name</span>
        <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Your full name" required />
      </label>

      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
      </label>

      <label>
        <span>Phone</span>
        <input type="tel" [(ngModel)]="phone" name="phone" placeholder="Your phone number" required />
      </label>

      <label>
        <span>Password</span>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Create a password" required />
      </label>

      <div class="form-actions">
        <button type="submit" class="primary-btn">Register</button>
      </div>

      <button type="button" class="link-btn" (click)="goToLogin()">
        Already have an account? Login
      </button>
    </form>
  </div>
</section>
