<section class="auth-panel" aria-label="Register form">
  @if (!isRegistered) {
    <div class="auth-card">
      <h2>Create account</h2>
      <p>Register to place orders and manage your cart.</p>

      <form class="auth-form" (ngSubmit)="submitRegister()">
        <label>
          <span>Full name</span>
          <input type="text" [(ngModel)]="name" name="name" placeholder="Your full name" required />
        </label>

        <label>
          <span>Username</span>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Choose a username" required />
        </label>

        <label>
          <span>Email</span>
          <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
        </label>

        <label>
          <span>Phone Number</span>

          <input
            type="text"
            [(ngModel)]="phone"
            name="phone"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="10"
            pattern="[0-9]{10}"
            placeholder="Your 10-digit phone number"
            (keydown)="allowOnlyNumbers($event)"
            (input)="filterPhone()"
            required
          />
        </label>

        <label>
          <span>Password</span>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Create a password" required />
        </label>

        @if (registerError) {
          <p class="form-error">{{ registerError }}</p>
        }

        <div class="form-actions">
          <button type="submit" class="primary-btn" [disabled]="isSubmitting">
            @if (isSubmitting) {
              <span class="button-spinner" aria-hidden="true"></span>
              Registering...
            } @else {
              Register
            }
          </button>
        </div>

        <button type="button" class="link-btn" (click)="goToLogin()">
          Already have an account? Login
        </button>
      </form>
    </div>
  } @else {
    <div class="auth-card success-card" aria-live="polite">
      <div class="success-badge">✓</div>
      <h2>Registration successful</h2>
      <p>Your account has been created successfully.</p>
      <button type="button" class="primary-btn" (click)="goToLogin()">Go to Login</button>
    </div>
  }
</section>
