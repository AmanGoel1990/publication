<section class="auth-panel" aria-label="Login form">
  @if (!isLoggedIn) {
    <div class="auth-card">
      <h2>Login to continue</h2>
      <p>Please sign in to add this book to your cart.</p>

      <form class="auth-form" (ngSubmit)="submitLogin()">
        <label>
          <span>Username</span>
          <input type="text" [(ngModel)]="username" name="username" placeholder="admin" required />
        </label>

        <label>
          <span>Password</span>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Enter password" required />
        </label>

        @if (loginError) {
          <p class="form-error">{{ loginError }}</p>
        }

        <div class="form-actions">
          <button type="submit" class="primary-btn">Login</button>
          <button type="button" class="secondary-btn" (click)="goToRegister()">Register</button>
        </div>

        <button type="button" class="link-btn" aria-label="Forgot password">
          Forgot password?
        </button>
      </form>
    </div>
  } @else {
    <div class="auth-card success-card" aria-live="polite">
      <div class="success-badge">✓</div>
      <h2>Welcome, {{ username }}!</h2>
      <p>Your login was successful. You can continue shopping.</p>
      <button type="button" class="primary-btn" (click)="continueShopping()">Continue</button>
    </div>
  }
</section>
